[package]
name = "framix_app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
framix_core = { path = "../core" }
prost = "0.14.4"
thiserror = "2.0.21"

[build-dependencies]
# protox compiles the .proto in pure Rust, so app builds (Xcode, Gradle) need no protoc.
prost-build = "0.14.4"
protox = "0.9.1"

[dev-dependencies]
proptest = "~1.11"
# Benchmarks (docs/plan.md tool review: criterion); no plots or rayon.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "render_thread"
harness = false
