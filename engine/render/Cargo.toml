[package]
name = "framix_render"
edition.workspace = true
version.workspace = true
publish.workspace = true

# wgpu rendering; implements app's PreviewRenderer. The test pattern is still the P1-001 spike.
[dependencies]
# Implements app's PreviewRenderer port, like storage implements ProjectStore.
framix_app = { path = "../app" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
thiserror = "2.0.21"
pollster = "=0.4.0"

# Same crate, Android backends on top.
[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "=0.6.4"
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLResource", "MTLTexture", "MTLPixelFormat", "MTLTypes"] }

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLResource", "MTLTexture", "MTLPixelFormat", "MTLTypes", "MTLDevice", "objc2-core-foundation", "objc2-io-surface"] }
# Already in the lockfile through wgpu-hal; used only to build an IOSurface like the iOS app.
objc2-io-surface = { version = "=0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation", "libc"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
