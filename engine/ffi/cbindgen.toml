# C header for the engine ABI; ffigen reads it to make the Dart bindings.
# Generated by scripts/gen_ffi.sh; check.sh fails if the header is stale.
language = "C"
include_guard = "FRAMIX_ENGINE_H"
autogen_warning = "/* Generated by cbindgen from engine/ffi. Do not edit; run scripts/gen_ffi.sh. */"
usize_is_size_t = true

[export]
include = ["EngineBuffer"]
# JNI entries (Kotlin) and spike entries (Swift dlsym) are not called through this header or Dart.
exclude = [
  "Java_com_travela_framix_EnginePlatform_nativeRegister",
  "Java_com_travela_framix_EnginePlatform_nativePreviewTextureDone",
  "Java_com_travela_framix_EnginePlatform_nativeRenderFrame",
  "engine_spike_draw_nv12",
  # NDK functions the Android shim imports, not engine exports.
  "ANativeWindow_fromSurface",
  "ANativeWindow_release",
]
