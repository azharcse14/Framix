[package]
name = "framix_ffi"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
# cdylib + staticlib for the Flutter build hook (native_toolchain_rust requires both),
# rlib so integration tests can link it.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
framix_app = { path = "../app" }
# MediaKind for thumbnail requests.
framix_core = { path = "../core" }
# Implements app's PreviewRenderer (GpuRenderer).
framix_render = { path = "../render" }
framix_storage = { path = "../storage" }
prost = "0.14.4"

# JNI shim for the Android platform vtable (android_platform.rs); raw bindings only.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "=0.4.1"
