[package]
name = "framix_ffi"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
# cdylib + staticlib for the Flutter build hook (native_toolchain_rust requires both),
# rlib so integration tests can link it.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
framix_app = { path = "../app" }
prost = "0.14.4"
