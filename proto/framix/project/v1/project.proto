// Project file format (*.framix project data), written by the engine only.
// Times are integer ticks (engine core::time). Never reuse or renumber a field; reserve
// removed ones. Bump FORMAT_VERSION (engine/app/src/project.rs) when old readers would
// misread a new file, and keep a fixture per version (engine/app/tests/fixtures).
syntax = "proto3";

package framix.project.v1;

// One saved project.
message ProjectFile {
  // Version that wrote the file.
  uint32 format_version = 1;
  // Oldest reader version that can open it; newer files are refused, not misread.
  uint32 min_reader_version = 2;
  repeated SavedTrack tracks = 3;
  // Canvas aspect ratio; 0:0 (files from before it existed) means the default 9:16.
  uint32 aspect_width = 4;
  uint32 aspect_height = 5;
  // Media the clips play (format 2+). Clips refer to these ids.
  repeated SavedMedia media = 6;
}

// What a saved media entry is.
enum SavedMediaKind {
  SAVED_MEDIA_KIND_UNSPECIFIED = 0;
  SAVED_MEDIA_KIND_VIDEO = 1;
  SAVED_MEDIA_KIND_IMAGE = 2;
}

// Imported media, validated again on load (the file is untrusted).
message SavedMedia {
  uint64 id = 1;
  string uri = 2;
  SavedMediaKind kind = 3;
  // Ticks; 0 for images.
  int64 duration = 4;
  uint32 width = 5;
  uint32 height = 6;
  uint32 rotation = 7;
  string codec = 8;
}

// What a track carries. Separate from the UI contract's TrackKind so the file format
// evolves on its own.
enum SavedTrackKind {
  SAVED_TRACK_KIND_UNSPECIFIED = 0;
  SAVED_TRACK_KIND_VIDEO = 1;
  SAVED_TRACK_KIND_AUDIO = 2;
}

// A track and its clips in timeline order. Ids are not stored: they are reassigned on load.
message SavedTrack {
  SavedTrackKind kind = 1;
  repeated SavedClip clips = 2;
  bool muted = 3;
  bool hidden = 4;
  bool locked = 5;
}

// A clip placement.
message SavedClip {
  uint64 media_id = 1;
  int64 source_start = 2;
  int64 start = 3;
  int64 duration = 4;
  // Format 3: crop, clockwise quarter turns and mirroring (all zero = untouched).
  uint32 turns = 5;
  bool flip_h = 6;
  bool flip_v = 7;
  uint32 crop_left = 8;
  uint32 crop_top = 9;
  uint32 crop_right = 10;
  uint32 crop_bottom = 11;
  // Format 4: canvas position (1/10000 of the canvas) and scale (1/1000; 0 = 1000).
  int32 x = 12;
  int32 y = 13;
  uint32 scale = 14;
}
