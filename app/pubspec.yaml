name: framix
description: "Framix photo and video editor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Exact pins (docs/toolchain.md): every version is at least 14 days old.
dependencies:
  ffi: 2.2.0
  fixnum: 1.1.1
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: 9.3.0
  hooks: 2.2.0
  intl: 0.20.3
  material_ui: 1.5.0
  native_toolchain_rust: 1.0.7
  protobuf: 6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  ffigen: 22.0.0

flutter:
  generate: true
  uses-material-design: true
